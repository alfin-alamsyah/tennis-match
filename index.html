<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tennis Session</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap">
<style>
:root{--hd:#2563eb;--bg:#f0f0f1;--card:#fff;--tx:#14213d;--mut:#64708a;--bd:#d9dde5;--ac:#2563eb;--onac:#fff;--ball:#d6e64a;--ok:#16a34a;--warn:#b25e00;--b1:#000;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:var(--hd)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--hd:#1e3a8a;--bg:#0f1623;--card:#1a2335;--tx:#e8edf6;--mut:#9aa6bd;--bd:#2c374d;--ac:#6b9bff;--onac:#0b1a3a;--ok:#4ade80;--warn:#ffb15c;--b1:#05080f;color-scheme:dark}}
:root[data-theme="dark"]{--hd:#1e3a8a;--bg:#0f1623;--card:#1a2335;--tx:#e8edf6;--mut:#9aa6bd;--bd:#2c374d;--ac:#6b9bff;--onac:#0b1a3a;--ok:#4ade80;--warn:#ffb15c;--b1:#05080f;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--tx);font:16px/1.4 'Plus Jakarta Sans',system-ui,sans-serif}
.hd{background:var(--hd);color:#fff;display:flex;align-items:center;gap:10px;padding:14px 16px;font-size:20px;font-weight:800}
.hd b{flex:1}.hd button{background:none;border:0;color:#fff;font-size:24px;min-width:44px;min-height:44px;cursor:pointer}
main{max-width:560px;margin:0 auto;padding:16px 16px 100px}
h1,h2{margin:0;font-weight:800}h1{font-size:26px}h2{font-size:24px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:10px}
.mut{color:var(--mut);font-size:14px}
input,select{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:10px;width:100%}
select{width:auto;padding:6px 8px}
.row{display:flex;gap:8px;margin-top:8px}
.btn{font:700 15px 'Plus Jakarta Sans',sans-serif;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;padding:10px 14px;min-height:44px;flex:1;cursor:pointer}
.btn.pri{background:var(--ac);border-color:var(--ac);color:var(--onac)}
.btn.ghost{background:none}.btn.big{width:100%;margin-top:6px}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.info{display:grid;grid-template-columns:1fr auto;gap:8px 12px;color:var(--mut);padding:2px 0 14px;border-bottom:1px solid var(--bd);margin-bottom:16px}
.info .rt{text-align:right}
.set{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
.set label{display:flex;align-items:center;gap:8px;font-weight:600}
.step{display:inline-flex;align-items:center;gap:8px}
.step button,.stp button{width:44px;height:44px;border-radius:50%;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:22px;cursor:pointer}
.sec{display:flex;align-items:center;justify-content:space-between;margin:6px 0 10px}
.chips{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 12px}
.chip{position:relative;flex:0 0 58px;height:50px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:700 18px 'Plus Jakarta Sans',sans-serif;cursor:pointer}
.chip.on{background:var(--ac);border-color:var(--ac);color:var(--onac)}
.chip i{position:absolute;top:1px;right:6px;font-size:13px;font-style:normal;color:var(--ok)}
.chip.on i{color:var(--onac)}
.mc{margin:34px 0 8px}
.mw{position:relative;background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:34px 16px 16px}
.sb{position:absolute;top:-18px;left:50%;transform:translateX(-50%);display:flex;gap:6px}
.sb button{min-width:58px;border:0;font:700 30px/1 'Plus Jakarta Sans',sans-serif;padding:8px 10px;border-radius:8px;color:#fff;cursor:pointer}
.b1{background:var(--b1)}.b2{background:var(--hd)}
.ck{position:absolute;top:-12px;left:14px;width:26px;height:26px;border-radius:50%;background:var(--bg);border:2px solid var(--bd);color:#fff;font-size:15px;text-align:center;line-height:22px}
.ck.on{background:var(--ac);border-color:var(--ac);color:var(--onac)}
.ct{position:absolute;top:-14px;right:12px;background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:2px 10px;font-weight:700;font-size:14px}
.tms{display:grid;grid-template-columns:1fr 1fr;font-size:18px;line-height:1.9}
.tms div+div{text-align:right;border-left:1px solid var(--bd);padding-left:8px}
.stp{display:flex;justify-content:space-between;margin-top:10px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.md{background:var(--card);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px))}
.md h3{margin:0 0 2px;font-size:20px}
.vr{display:flex;align-items:center;justify-content:center;gap:18px;margin:14px 0}
.vr button{width:56px;height:56px;border-radius:50%;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:28px;cursor:pointer}
.vr b{font-size:64px;line-height:1;min-width:90px;text-align:center}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pad button{min-height:52px;border-radius:12px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font:700 22px 'Plus Jakarta Sans',sans-serif;cursor:pointer}
.rest{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-top:22px;color:var(--mut)}
.rest b{color:var(--tx)}
.up{background:var(--card);border:2px dashed var(--ac);border-radius:12px;padding:14px;margin-top:14px}
.up p{margin:6px 0}.up .btn{margin-top:6px;width:100%}
.prow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.prow.late{border-style:dashed}.prow.left{opacity:.55}
.pn{flex:1 1 110px;display:flex;flex-direction:column}
.seg{display:flex;border:1px solid var(--bd);border-radius:10px;overflow:hidden}
.seg button{border:0;background:none;color:var(--mut);font:700 14px 'Plus Jakarta Sans',sans-serif;padding:9px 11px;min-height:40px;cursor:pointer}
.seg button.on{color:var(--bg)}
.seg button.on.here{background:var(--ok)}.seg button.on.late{background:var(--warn)}.seg button.on.left{background:var(--mut)}
.tag{font-size:12px;background:var(--ball);color:#1d2a05;border-radius:6px;padding:1px 6px;width:max-content;margin-top:2px}
.x{border:0;background:none;color:var(--mut);font-size:18px;min-width:40px;min-height:40px;cursor:pointer}
table{width:100%;border-collapse:collapse}
th,td{padding:10px 6px;text-align:center;border-bottom:1px solid var(--bd)}
th{font-weight:600;color:var(--mut);font-size:14px}
td:nth-child(2),th:nth-child(2){text-align:left}
tr.top td{background:var(--ball);color:#1d2a05;font-weight:700}tr.dim td{color:var(--mut)}
#nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}
#nav button{flex:1;border:0;background:none;color:var(--mut);font:700 15px 'Plus Jakarta Sans',sans-serif;padding:16px 0;cursor:pointer}
#nav button.on{color:var(--tx);box-shadow:inset 0 3px 0 var(--ac)}
#toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:15px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90%;text-align:center}
#toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
html{-webkit-text-size-adjust:100%;touch-action:manipulation}
html,body{max-width:100%;overflow-x:hidden}
button,select,label,input{touch-action:manipulation}
button{-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
input,select{min-width:0;max-width:100%;font-size:16px}
input[type=date],input[type=time]{-webkit-appearance:none;appearance:none;min-height:46px;text-align:left;display:block}
.row>*{min-width:0}
.md{overflow-x:hidden}
.md label{display:block;min-width:0}
.md label input{width:100%;margin-top:4px}
.md .chips{flex-wrap:wrap;overflow:visible}
.md .chips .btn{flex:1 1 40%!important}
.prow .seg{flex:1 1 100%;margin-top:8px}
.prow .seg button{flex:1}
.prow .x{flex:0 0 auto;width:38px;height:38px;min-width:0;min-height:0;border:1px solid var(--bd);border-radius:50%;font-size:15px;line-height:1}
.btn:disabled{opacity:.6;cursor:wait}
</style>
<script src="config.js"></script>
</head>
<body>
<header class="hd"><span aria-hidden="true">🎾</span><b>Tennis Session</b><button id="livebtn" data-a="live" hidden style="font-size:15px;font-weight:700;border:1px solid #fff9;border-radius:16px;padding:0 12px;min-height:34px">Go live</button><button data-a="gear" aria-label="Settings">⚙</button></header>
<main id="app"></main>
<nav id="nav"></nav>
<div id="modal"></div><div id="toast" role="status"></div>
<script>
/* Live sync: the Firebase URL is set in config.js (next to this file). */
const DB_URL=(window.DB_URL||"");
const CID=Math.random().toString(36).slice(2,10),SHARED=["players","matches","rest","set","info","date"];
let CODE=((location.hash||"").slice(1).trim().toLowerCase()),live=false,applying=false,pt,es,pullT;
if(!/^[a-z0-9]{6,12}$/.test(CODE))CODE="";
const KEY="tennis-session-v1"+(CODE?"-"+CODE:""),DEF={courts:1,format:"auto",target:4,pair:"ams",mode:"total",total:4};
let S={players:[],matches:[],rest:{},set:{...DEF},tab:"rounds",cur:0,gear:false,date:0};
try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
S.set=Object.assign({...DEF},S.set);S.rest=S.rest||{};S.info=S.info||{};if(S.tab==="matches")S.tab="rounds";
S.matches.forEach((m,i)=>{if(!m.r){m.r=i+1;m.court=1}});
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}push()};
let uid=Date.now(),armed=false,foc=false,tt,ED=null,SH=null,DL=null,LK=false,SV=null;
const nid=()=>String(uid++),$=s=>document.querySelector(s),P=id=>S.players.find(p=>p.id===id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const nm=i=>esc(P(i)?P(i).name:"?"),pad=n=>String(n).padStart(2,"0");
const cnt=id=>S.matches.filter(x=>x.t1.includes(id)||x.t2.includes(id)).length;
const rn=()=>[...new Set(S.matches.map(m=>m.r))].sort((a,b)=>a-b);
const PAIR={ams:"Americano",mex:"Mexicano",koth:"King of the hill"};
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("on"),2200)}
function stats(){
  const m={};S.players.forEach(p=>m[p.id]={w:0,d:0,l:0,gf:0,ga:0,n:0,mc:0,tot:0});
  const add=(o,f,a,r)=>{if(!o)return;o.gf+=f;o.ga+=a;o.n++;r>0?o.w++:r<0?o.l++:o.d++};
  const dn=S.matches.filter(x=>x.done);
  dn.forEach(x=>{const r=Math.sign(x.s1-x.s2);
    x.t1.forEach(i=>add(m[i],x.s1,x.s2,r));x.t2.forEach(i=>add(m[i],x.s2,x.s1,-r))});
  /* Americano points: each player gets the points their team scored. Missed matches (vs the most-played player) are compensated with half a match's points each. */
  const vs=Object.values(m),mx=Math.max(0,...vs.map(o=>o.n)),avg=dn.length?dn.reduce((s,x)=>s+(x.s1+x.s2)/2,0)/dn.length:0;
  vs.forEach(o=>{o.mc=o.n?Math.round((mx-o.n)*avg):0;o.tot=o.gf+o.mc});
  return m;
}
const rankCmp=(a,b)=>b.tot-a.tot||(b.gf-b.ga)-(a.gf-a.ga)||b.w-a.w||a.p.name.localeCompare(b.p.name);
function plan(R){
  
  
  
  const pool=S.players.filter(p=>p.status==="here").map(p=>({id:p.id,c:cnt(p.id),r:Math.random()})).sort((a,b)=>a.c-b.c||a.r-b.r).map(o=>o.id);
  let fmt=S.set.format;if(fmt==="auto")fmt=pool.length>=4?"doubles":"singles";
  const need=fmt==="doubles"?4:2;
  if(pool.length<need)return {err:"Need at least "+need+" players marked Here."};
  const n=Math.min(S.set.courts,Math.floor(pool.length/need)),chosen=pool.slice(0,n*need);
  let out=null;
  if(S.set.pair==="koth"){const lm=[...S.matches].reverse().find(x=>x.done&&x.s1!==x.s2);
    if(lm){const win=lm.s1>lm.s2?lm.t1:lm.t2;
      if(win.length*2===need&&win.every(i=>P(i)&&P(i).status==="here")){
        const ch=pool.filter(i=>!win.includes(i)).slice(0,win.length);
        if(ch.length===win.length)out=[{t1:win,t2:ch}]}}}
  if(!out&&S.set.pair==="mex"){const st=stats(),sc=i=>st[i].tot*1000+st[i].gf-st[i].ga,a=[...chosen].sort((x,y)=>sc(y)-sc(x));out=[];
    for(let i=0;i<n;i++){const g=a.slice(i*need,i*need+need);out.push(need===4?{t1:[g[0],g[3]],t2:[g[1],g[2]]}:{t1:[g[0]],t2:[g[1]]})}}
  if(!out){
    const key=(a,b)=>a<b?a+"|"+b:b+"|"+a,pc={},oc={};
    S.matches.forEach(x=>{
      [x.t1,x.t2].forEach(t=>{for(let i=0;i<t.length;i++)for(let j=i+1;j<t.length;j++){const k=key(t[i],t[j]);pc[k]=(pc[k]||0)+1}});
      x.t1.forEach(a=>x.t2.forEach(b=>{const k=key(a,b);oc[k]=(oc[k]||0)+1}));
    });
    let bc=1e9;
    for(let k=0;k<200;k++){
      const a=chosen.map(x=>[x,Math.random()]).sort((p,q)=>p[1]-q[1]).map(p=>p[0]),ms=[];let c=0;
      for(let i=0;i<n;i++){
        const g=a.slice(i*need,i*need+need);
        const t1=need===4?[g[0],g[1]]:[g[0]],t2=need===4?[g[2],g[3]]:[g[1]];
        if(need===4)c+=3*(pc[key(g[0],g[1])]||0)+3*(pc[key(g[2],g[3])]||0);
        t1.forEach(x=>t2.forEach(y=>c+=oc[key(x,y)]||0));
        ms.push({t1,t2});
      }
      if(c<bc){bc=c;out=ms}
    }
  }
  return {out,rest:pool.filter(i=>!out.some(o=>o.t1.includes(i)||o.t2.includes(i)))};
  
  
  }
function newRound(){
  const rs=rn(),last=rs[rs.length-1];
  if(last&&S.matches.some(m=>m.r===last&&!m.done))return toast("Finish round "+last+" first.");
  const R=(last||0)+1;
  let p=S.draft&&S.draft.R===R&&!S.draft.err&&S.set.pair==="ams"?S.draft:null;
  if(!p){p=plan(R);if(p.err)return toast(p.err)}
  p.out.forEach((o,i)=>S.matches.push({id:nid(),r:R,court:i+1,t1:o.t1,t2:o.t2,s1:0,s2:0,done:false,cap:S.set.mode==="total"?S.set.total:0,T:S.set.target}));
  S.rest[R]=p.rest;S.draft=null;
  if(!S.date)S.date=Date.now();
  S.cur=R;S.tab="rounds";
}
function vSettings(){
  const T=S.set.target;
  return `<div class="card set">
    <label>Courts <span class="step"><button data-a="courts" data-v="-1" aria-label="Fewer courts">−</button><b>${S.set.courts}</b><button data-a="courts" data-v="1" aria-label="More courts">+</button></span></label>
    <label>Format <select data-s="format">${[["auto","Auto"],["singles","Singles"],["doubles","Doubles"]].map(([k,t])=>`<option value="${k}"${S.set.format===k?" selected":""}>${t}</option>`).join("")}</select></label>
    <label>Pairing <select data-s="pair">${Object.entries(PAIR).map(([k,t])=>`<option value="${k}"${S.set.pair===k?" selected":""}>${t}</option>`).join("")}</select></label>
    <label>Match ends <select data-s="mode"><option value="first"${S.set.mode==="first"?" selected":""}>First to</option><option value="total"${S.set.mode==="total"?" selected":""}>Total games</option></select>
    ${S.set.mode==="total"?`<select data-s="total">${[4,6,8,16,24,32].map(n=>`<option${S.set.total===n?" selected":""}>${n}</option>`).join("")}</select>`:`<select data-s="target">${[3,4,6,8].map(n=>`<option${T===n?" selected":""}>${n}</option>`).join("")}</select>`}</label>
    <p class="mut" style="margin:0">Changes apply to the next round and to scores not saved yet.</p></div>`;
}
function card(m){
  
  return `<div class="mc"><div class="mw"><span class="ck ${m.done?"on":""}">${m.done?"✓":""}</span><div class="sb"><button class="b1" data-a="ed" data-id="${m.id}" data-v="1" aria-label="Enter score for team 1">${pad(m.s1)}</button><button class="b2" data-a="ed" data-id="${m.id}" data-v="2" aria-label="Enter score for team 2">${pad(m.s2)}</button></div><span class="ct">Court ${m.court||1}</span>
  <div class="tms"><div>${m.t1.map(nm).join("<br>")}</div><div>${m.t2.map(nm).join("<br>")}</div></div></div>
  ${m.done?`<div class="row"><button class="btn" data-a="edit" data-id="${m.id}">Edit score</button></div>`
  :`<button class="btn pri big" data-a="fin" data-id="${m.id}">Save result</button>`}</div>`;
}
function vRounds(){
  const rs=rn(),R=rs.includes(S.cur)?S.cur:(rs[rs.length-1]||0),ms=S.matches.filter(m=>m.r===R);
  const here=S.players.filter(p=>p.status==="here").length,c=S.set.courts;
  const date=new Date(S.date||Date.now()).toLocaleString([],{month:"2-digit",day:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"});
  const rest=(S.rest[R]||[]).filter(i=>P(i));
  return `<h1>Match Rounds</h1>
  <div class="info"><div>${PAIR[S.set.pair]}</div><div class="rt">${date}</div><div>${S.set.mode==="total"?"Total "+S.set.total+" games, ties allowed":"First to "+S.set.target}</div><div class="rt">${here} players, ${c} court${c>1?"s":""}</div></div>
  ${S.gear?vSettings():""}
  ${rs.length?`<div class="chips">${rs.map(r=>`<button class="chip ${r===R?"on":""}" data-a="round" data-v="${r}" aria-label="Round ${r}">${r}${S.matches.filter(m=>m.r===r).every(m=>m.done)?"<i>✓</i>":""}</button>`).join("")}</div>
  <div class="sec"><h2>Round #${R}</h2><button class="btn" style="flex:0 0 auto" data-a="next">Next round</button></div>
  ${ms.some(m=>!m.done)?'<p class="mut" style="margin:6px 0 0">Tap a score box to enter the score.</p>':""}
  ${ms.map(card).join("")}
  ${rest.length?`<div class="rest"><b>Rest players:</b> ${rest.map(nm).join(", ")}</div>`:""}
  ${R===rs[rs.length-1]?vNext(R):""}
  ${R===rs[rs.length-1]?`<button class="btn big ghost" style="margin-top:14px" data-a="delr">Delete this round</button>`:""}`
  :`<div class="card"><p>No rounds yet. Add players, mark who has arrived, then start round 1.</p><button class="btn pri big" data-a="next">Start round 1</button></div>`}`;
}
function vPlayers(){
  const h=S.players.filter(p=>p.status==="here").length,l=S.players.filter(p=>p.status==="late").length;
  return `<h1>Players</h1><br>
  <div class="card"><input id="nm" placeholder="Player name" maxlength="24" autocomplete="off" enterkeyhint="done">
    <div class="row"><button class="btn pri" data-a="add" data-v="here">Add as here</button><button class="btn" data-a="add" data-v="late">Add as not arrived</button></div></div>
  <p class="mut">${h} here${l?", "+l+" not arrived yet":""}. Add people any time, even mid-session.</p>
  ${S.players.map(p=>`<div class="card prow ${p.status}"><div class="pn"><b>${esc(p.name)}</b><span class="mut">${cnt(p.id)} played</span></div>
    ${cnt(p.id)?"":`<button class="x" data-a="rm" data-id="${p.id}" aria-label="Remove ${esc(p.name)}">✕</button>`}<div class="seg">${[["here","Here"],["late","Not yet"],["left","Left"]].map(([k,t])=>`<button class="${p.status===k?"on "+k:""}" data-a="st" data-id="${p.id}" data-v="${k}">${t}</button>`).join("")}</div>
    </div>`).join("")||'<p class="mut">Add the first player to get started.</p>'}`;
}
function vBoard(){
  const st=stats();
  const rows=S.players.map(p=>({p,...st[p.id]})).sort(rankCmp);
  return `<h1>Leaderboard</h1><br>
  ${rows.length?`<div class="card" style="overflow-x:auto"><table><tr><th>#</th><th>Player</th><th>G</th><th>W-D-L</th><th>Diff</th><th>+M</th><th>P</th></tr>

function vLink(){return `<div class="ov" data-a="lkclose"><div class="md" role="dialog" aria-modal="true" aria-label="Live link"><h3>Live match link</h3>
